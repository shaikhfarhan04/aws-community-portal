{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3">Create community profile</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Full name *</label><input class="form-control" name="full_name" maxlength="150" required></div><div class="mb-3"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" required></div><div class="mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="mb-3"><label class="form-label">City</label><input class="form-control" name="city"></div><div class="mb-3"><label class="form-label">Skills</label><textarea class="form-control" name="skills"></textarea></div><div class="mb-3"><label class="form-label">Experience years</label><input class="form-control" type="number" name="experience_years" min="0" max="80" step="0.5"></div><div class="mb-3"><label class="form-label">Password (12+ characters) *</label><input class="form-control" type="password" name="password" minlength="12" autocomplete="new-password" required></div><div class="mb-3"><label class="form-label">Confirm password *</label><input class="form-control" type="password" name="confirm_password" minlength="12" required></div><button class="btn btn-primary">Register</button></form></div></div></div></div>{% endblock %}
