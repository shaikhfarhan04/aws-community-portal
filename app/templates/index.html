{% extends 'base.html' %}{% block content %}<div class="p-5 bg-white rounded-3 shadow-sm"><h1>AWS Community Registration Portal</h1><p class="lead">Register your profile and securely store your resume and documents.</p>{% if current_user.is_authenticated %}<a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Open dashboard</a>{% else %}<a class="btn btn-primary me-2" href="{{ url_for('auth.register') }}">Create account</a><a class="btn btn-outline-secondary" href="{{ url_for('auth.login') }}">Sign in</a>{% endif %}</div>{% endblock %}
