<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}AWS Community Portal{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('main.index') }}">AWS Community Portal</a><div class="navbar-nav ms-auto flex-row gap-3">{% if current_user.is_authenticated %}<a class="nav-link" href="{{ url_for('main.dashboard') }}">Dashboard</a><form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-link nav-link" type="submit">Sign out</button></form>{% else %}<a class="nav-link" href="{{ url_for('auth.login') }}">Sign in</a><a class="nav-link" href="{{ url_for('auth.register') }}">Register</a>{% endif %}</div></div></nav><main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ 'alert-success' if category=='success' else 'alert-danger' if category=='error' else 'alert-info' }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
